# Local development: app + Postgres 16 with pgvector (docs/architecture.md §12).
#   docker compose up --build
#   → http://localhost:3000  (migrations apply automatically at container start)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: manakai
      POSTGRES_PASSWORD: manakai
      POSTGRES_DB: manakai
    ports:
      - "5432:5432"
    volumes:
      - manakai-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manakai -d manakai"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://manakai:manakai@db:5432/manakai
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  manakai-db:
